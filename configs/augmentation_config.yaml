# ── Augmentation Config ──────────────────────────────────────────────────────
# Three levels for curriculum learning: light → medium → heavy

light:
  description: "Clean, easy augmentations for initial training"
  transforms:
    - name: "RandomBrightnessContrast"
      params:
        brightness_limit: 0.1
        contrast_limit: 0.1
        p: 0.3
    - name: "GaussNoise"
      params:
        var_limit: [5, 15]
        p: 0.2
    - name: "Rotate"
      params:
        limit: 5
        border_mode: 0   # BORDER_CONSTANT
        p: 0.2

medium:
  description: "Moderate augmentations simulating real-world conditions"
  transforms:
    - name: "RandomBrightnessContrast"
      params:
        brightness_limit: 0.2
        contrast_limit: 0.2
        p: 0.5
    - name: "GaussNoise"
      params:
        var_limit: [10, 50]
        p: 0.3
    - name: "Rotate"
      params:
        limit: 10
        border_mode: 0
        p: 0.4
    - name: "GaussianBlur"
      params:
        blur_limit: [3, 5]
        p: 0.3
    - name: "ShiftScaleRotate"
      params:
        shift_limit: 0.03
        scale_limit: 0.05
        rotate_limit: 5
        border_mode: 0
        p: 0.3
    - name: "RandomShadow"
      params:
        shadow_roi: [0, 0, 1, 1]
        num_shadows_limit: [1, 2]
        shadow_dimension: 5
        p: 0.2

heavy:
  description: "Aggressive augmentations for hard examples (messy handwriting)"
  transforms:
    - name: "RandomBrightnessContrast"
      params:
        brightness_limit: 0.3
        contrast_limit: 0.3
        p: 0.5
    - name: "GaussNoise"
      params:
        var_limit: [20, 80]
        p: 0.5
    - name: "Rotate"
      params:
        limit: 15
        border_mode: 0
        p: 0.5
    - name: "GaussianBlur"
      params:
        blur_limit: [3, 7]
        p: 0.4
    - name: "ElasticTransform"
      params:
        alpha: 1.0
        sigma: 50
        p: 0.3
    - name: "ShiftScaleRotate"
      params:
        shift_limit: 0.05
        scale_limit: 0.1
        rotate_limit: 10
        border_mode: 0
        p: 0.4
    - name: "Perspective"
      params:
        scale: [0.05, 0.1]
        p: 0.3
    - name: "Downscale"
      params:
        scale_range: [0.5, 0.75]
        p: 0.2
    - name: "ImageCompression"
      params:
        quality_range: [50, 90]
        p: 0.2

# ── Normalization (always applied) ──────────────────────────────────────────
normalize:
  mean: [0.485, 0.456, 0.406]      # ImageNet stats
  std: [0.229, 0.224, 0.225]
  max_pixel_value: 255.0

# ── Resize (always applied) ─────────────────────────────────────────────────
resize:
  height: 960
  width: 1280
  keep_aspect_ratio: true
  pad_value: 255                    # White padding
