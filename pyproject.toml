[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medscript-ai"
version = "0.1.0"
description = "Privacy-first AI system for transcribing doctor handwriting into structured digital text"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Navketan Singh", email = "navketan@medscript.ai" },
]
keywords = ["medical", "ocr", "handwriting", "prescription", "nlp", "computer-vision"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    # Core AI / ML
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "transformers>=4.40.0",
    "pytorch-lightning>=2.2.0",
    "tokenizers>=0.19.0",
    "datasets>=2.19.0",
    "safetensors>=0.4.0",

    # Computer Vision & OCR
    "opencv-python-headless>=4.9.0",
    "albumentations>=1.4.0",
    "kornia>=0.7.0",
    "Pillow>=10.3.0",
    "easyocr>=1.7",

    # NLP
    "nltk>=3.8.0",
    "editdistance>=0.6.0",

    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",

    # Auth (OAuth 2.0 + RBAC)
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",

    # Task Queue
    "celery[redis]>=5.3.0",

    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    "pymongo>=4.6.0",
    "alembic>=1.13.0",

    # Storage & Cache
    "boto3>=1.34.0",
    "redis>=5.0.0",

    # Config & Logging
    "pyyaml>=6.0.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.0",

    # Monitoring
    "mlflow>=2.12.0",
    "prometheus-client>=0.20.0",

    # Synthetic Data
    "fonttools>=4.50.0",

    # Utilities
    "rich>=13.7.0",
    "click>=8.1.0",
    "tqdm>=4.66.0",
    "numpy>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "pre-commit>=3.7.0",
    "ipykernel>=6.29.0",
    "jupyter>=1.0.0",
]

[project.scripts]
medscript-train = "scripts.train:main"
medscript-evaluate = "scripts.evaluate:main"
medscript-serve = "api.main:run"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["medscript", "api"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.hatch.build.targets.wheel]
packages = ["src/medscript"]
